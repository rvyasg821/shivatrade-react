    <text x="15" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1565c0">12</text>
    <text x="15" y="78" font-family="Arial, sans-serif" font-size="11" fill="#42a5f5">Locations</text>
