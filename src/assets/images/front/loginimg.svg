    <circle cx="200" cy="160" r="4" fill="#66bb6a"/>
    <circle cx="750" cy="180" r="3" fill="#42a5f5"/>
    <circle cx="300" cy="100" r="5" fill="#ffa726"/>
    <circle cx="650" cy="130" r="3" fill="#66bb6a"/>
    <circle cx="180" cy="880" r="4" fill="#42a5f5"/>
    <circle cx="780" cy="850" r="5" fill="#66bb6a"/>
    <circle cx="400" cy="950" r="3" fill="#ffa726"/>
    <circle cx="600" cy="920" r="4" fill="#42a5f5"/>
