    <rect x="126" y="195" rx="18" ry="18" width="700" height="470" fill="white"/>
  </g>

  <!-- Dashboard header bar -->
  <rect x="126" y="195" rx="18" ry="18" width="700" height="56" fill="url(#headerGrad)"/>
  <rect x="126" y="233" width="700" height="18" fill="url(#headerGrad)"/>

  <!-- Window dots -->
  <circle cx="160" cy="223" r="7" fill="#ff5f57"/>
  <circle cx="182" cy="223" r="7" fill="#ffbd2e"/>
  <circle cx="204" cy="223" r="7" fill="#28c840"/>

  <!-- Dashboard title -->
  <text x="240" y="229" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="white" letter-spacing="0.5">PeopleGem Dashboard</text>

  <!-- Search bar placeholder -->
