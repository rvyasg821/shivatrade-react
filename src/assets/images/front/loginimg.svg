      <circle cx="14" cy="14" r="8" fill="none" stroke="#f57c00" stroke-width="2" opacity="0.7"/>
      <line x1="14" y1="14" x2="14" y2="9" stroke="#f57c00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <line x1="14" y1="14" x2="18" y2="14" stroke="#f57c00" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
