  <text x="156" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#37474f" letter-spacing="0.3">TEAM OVERVIEW</text>

  <!-- Person 1 -->
  <g transform="translate(156, 300)">
    <rect rx="12" ry="12" width="310" height="58" fill="#f8fdf8"/>
    <circle cx="32" cy="29" r="22" fill="url(#greenGrad)"/>
    <circle cx="32" cy="22" r="8" fill="white"/>
    <path d="M 18 38 Q 18 30 32 30 Q 46 30 46 38" fill="white" opacity="0.85"/>
    <text x="64" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#263238">Sarah Johnson</text>
    <text x="64" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#78909c">HR Manager · London</text>
    <rect x="230" y="14" rx="10" ry="10" width="60" height="22" fill="#e8f5e9"/>
    <circle cx="244" cy="25" r="4" fill="#43a047"/>
    <text x="253" y="29" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Active</text>
  </g>

  <!-- Person 2 -->
  <g transform="translate(156, 367)">
    <rect rx="12" ry="12" width="310" height="58" fill="#f5f9ff"/>
    <circle cx="32" cy="29" r="22" fill="url(#blueGrad)"/>
    <circle cx="32" cy="22" r="8" fill="white"/>
    <path d="M 18 38 Q 18 30 32 30 Q 46 30 46 38" fill="white" opacity="0.85"/>
    <text x="64" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#263238">James Wilson</text>
    <text x="64" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#78909c">Team Lead · Manchester</text>
    <rect x="230" y="14" rx="10" ry="10" width="68" height="22" fill="#e3f2fd"/>
    <circle cx="244" cy="25" r="4" fill="#1976d2"/>
    <text x="253" y="29" font-family="Arial, sans-serif" font-size="10" fill="#1565c0">On Leave</text>
  </g>

  <!-- Person 3 -->
  <g transform="translate(156, 434)">
    <rect rx="12" ry="12" width="310" height="58" fill="#fffbf5"/>
    <circle cx="32" cy="29" r="22" fill="url(#orangeGrad)"/>
    <circle cx="32" cy="22" r="8" fill="white"/>
    <path d="M 18 38 Q 18 30 32 30 Q 46 30 46 38" fill="white" opacity="0.85"/>
    <text x="64" y="24" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#263238">Emma Davis</text>
    <text x="64" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#78909c">Payroll Admin · Bristol</text>
    <rect x="230" y="14" rx="10" ry="10" width="60" height="22" fill="#e8f5e9"/>
    <circle cx="244" cy="25" r="4" fill="#43a047"/>
    <text x="253" y="29" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Active</text>
