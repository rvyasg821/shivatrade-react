<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 1024" fill="none">
  <defs>
    <!-- Full background gradient — soft green-blue matching PeopleGem logo -->
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3c34;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1b4332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14304a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43a047;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00897b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00796b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowSmall" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#43a047" flood-opacity="0.15"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#1e88e5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Full background -->
  <rect width="952" height="1024" fill="url(#pageBg)"/>

  <!-- Subtle pattern overlay -->
  <g opacity="0.04">
    <circle cx="100" cy="100" r="200" fill="#43a047"/>
    <circle cx="850" cy="900" r="250" fill="#1e88e5"/>
    <circle cx="800" cy="150" r="150" fill="#f57c00"/>
    <circle cx="150" cy="850" r="180" fill="#00897b"/>
  </g>

  <!-- Decorative gem shapes in background -->
  <g opacity="0.06">
    <polygon points="80,120 130,150 130,200 80,230 30,200 30,150" fill="#66bb6a"/>
    <polygon points="820,80 870,110 870,155 820,185 770,155 770,110" fill="#42a5f5"/>
    <polygon points="870,700 920,730 920,775 870,805 820,775 820,730" fill="#ffa726"/>
    <polygon points="60,650 110,680 110,725 60,755 10,725 10,680" fill="#42a5f5"/>
    <polygon points="450,50 500,80 500,125 450,155 400,125 400,80" fill="#66bb6a"/>
    <polygon points="500,880 550,910 550,955 500,985 450,955 450,910" fill="#00897b"/>
  </g>

  <!-- Floating dots -->
